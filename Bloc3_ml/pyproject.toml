[project]
name = "bloc3-ml"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.6",
    "pandas",
    "pandas-ta",
    "numpy",
    "scikit-learn>=1.5.0",
    "xgboost>=2.1.0",
    "mlflow>=2.16.0",
    "joblib>=1.4.0",
    "requests>=2.32.0",
    "python-dotenv>=1.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.0",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0.0",
    "httpx>=0.27.0,<1.0",
    "gunicorn>=23.0.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
