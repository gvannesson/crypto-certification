# Configuration du proxy LiteLLM — veille C6 (suivi de la consommation de tokens/coût
# d'une clé API multi-provider) et paramétrage C8 (monitoring du service Claude).
# Doc officielle : https://docs.litellm.ai/docs/simple_proxy

model_list:
  - model_name: claude-sonnet-4-6
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
