name: CI — Tests & Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-bloc1:
    name: Bloc1 Data — Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Bloc1_data

    env:
      DB_USERNAME: test
      DB_PASSWORD: test
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: test_db
      API_E1_SECRET_KEY: ci-test-secret-key
      API_E1_ALGORITHM: HS256
      API_E1_SCRIPT_USERNAME: script_bot
      API_E1_SCRIPT_PASSWORD: script_pass
      API_E1_SCRIPT_ROLE: script

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests with coverage
        run: uv run pytest tests/ -v --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-bloc1
          path: Bloc1_data/coverage.xml

  test-bloc3:
    name: Bloc3 ML — Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Bloc3_ml

    env:
      API_E1_BASE_URL: http://localhost:8001
      API_E3_SECRET_KEY: ci-test-secret-key
      API_E3_ALGORITHM: HS256
      API_E3_USERNAME: ml_user
      API_E3_PASSWORD: ml_password
      MODELS_DIR_PATH: /tmp/test_models
      MLFLOW_TRACKING_URI: http://localhost:5000

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests with coverage
        run: uv run pytest tests/ -v --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-bloc3
          path: Bloc3_ml/coverage.xml

  test-bloc4:
    name: Bloc4 App — Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Bloc4_app

    env:
      DJANGO_SECRET_KEY: ci-test-secret-key
      DJANGO_DB_ENGINE: django.db.backends.sqlite3
      DJANGO_DB_NAME: ":memory:"
      API_E1_BASE_URL: http://localhost:8001
      API_E3_BASE_URL: http://localhost:8002
      API_E1_SCRIPT_USERNAME: script_user
      API_E1_SCRIPT_PASSWORD: script_pass
      API_E3_USERNAME: ml_user
      API_E3_PASSWORD: ml_pass

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests with coverage
        run: uv run pytest tests/ -v --cov=accounts --cov=dashboard --cov=forecast --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-bloc4
          path: Bloc4_app/coverage.xml

  lint:
    name: Lint — Ruff
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install ruff
        run: uv tool install ruff

      - name: Lint Bloc1_data
        run: ruff check Bloc1_data/src/ --output-format=github

      - name: Lint Bloc3_ml
        run: ruff check Bloc3_ml/src/ --output-format=github

      - name: Lint Bloc4_app
        run: ruff check Bloc4_app/ --output-format=github --ignore=E501

  # === C13 : packaging — construit et publie l'image ml-api après succès des tests ===
  # Ne s'exécute que sur push vers main (pas sur les PR), une fois test-bloc3 validé :
  # dépendance explicite au succès des tests, comme la chaîne Woodpecker de référence.
  build-ml-api:
    name: Build & Push — ml-api (ghcr.io)
    needs: test-bloc3
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ml-api image
        uses: docker/build-push-action@v6
        with:
          context: Bloc3_ml
          file: Bloc3_ml/api.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/crypto-ml-api:latest
            ghcr.io/${{ github.repository_owner }}/crypto-ml-api:${{ github.sha }}

  # === C13 : déploiement — scopé à ce qui existe réellement (pas de serveur cible) ===
  # Vérifie que l'image publiée est effectivement récupérable (preuve que le packaging
  # est utilisable en pratique), et documente la commande réelle de redéploiement plutôt
  # que de simuler un push SSH vers un serveur qui n'existe pas pour ce projet.
  deploy-ml-api:
    name: Deploy (verify pull) — ml-api
    needs: build-ml-api
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the published image is pullable
        run: docker pull ghcr.io/${{ github.repository_owner }}/crypto-ml-api:${{ github.sha }}

      - name: Redeploy command (documentation)
        run: |
          echo "Image vérifiée disponible sur le registre."
          echo "Redéploiement sur l'environnement cible :"
          echo "  docker compose pull ml-api && docker compose up -d ml-api"

  # === C19 : packaging — construit et publie l'image webapp après succès des tests ===
  # Même schéma que build-ml-api/deploy-ml-api : referme l'écart documenté au rapport E4
  # (§7.2, "aucune image webapp n'est construite ni publiée depuis la CI").
  build-webapp:
    name: Build & Push — webapp (ghcr.io)
    needs: test-bloc4
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push webapp image
        uses: docker/build-push-action@v6
        with:
          context: Bloc4_app
          file: Bloc4_app/app.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/crypto-webapp:latest
            ghcr.io/${{ github.repository_owner }}/crypto-webapp:${{ github.sha }}

  # === C19 : déploiement — scopé à ce qui existe réellement (pas de serveur cible) ===
  deploy-webapp:
    name: Deploy (verify pull) — webapp
    needs: build-webapp
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the published image is pullable
        run: docker pull ghcr.io/${{ github.repository_owner }}/crypto-webapp:${{ github.sha }}

      - name: Redeploy command (documentation)
        run: |
          echo "Image vérifiée disponible sur le registre."
          echo "Redéploiement sur l'environnement cible :"
          echo "  docker compose pull webapp && docker compose up -d webapp"
